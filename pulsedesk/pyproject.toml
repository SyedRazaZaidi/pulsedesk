[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsedesk"
version = "1.0.0"
description = "Ops demand desk: LightGBM quantile forecast, SQLite decision log, one FastAPI process."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Syed Muhammad Raza Zaidi" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "lightgbm>=4.5.0",
  "scikit-learn>=1.5.0",
  "joblib>=1.4.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "httpx>=0.27.0"]

[project.scripts]
pulsedesk = "pulsedesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pulsedesk = ["serve/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
